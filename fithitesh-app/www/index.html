<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F6B3F">
<meta name="description" content="Food, water, workouts, sports, weight trend and mind habits in one private, offline app.">
<title>FitHitesh</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* ============ Theme tokens (court green + tennis ball) ============ */
:root{
  --bg:#F2F4EE; --surface:#FFFFFF; --soft:#E9EEE4; --ink:#15231B; --muted:#55645B; --line:#DDE3D8;
  --accent:#2F6B3F; --accent-ink:#FFFFFF; --ball:#C9DD3C; --water:#2463A6; --warn:#B4531A;
  --carb:#9A6F0E; --fat:#84489A; --fib:#2F7A73;
  --display:'Archivo',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1712; --surface:#18231C; --soft:#1F2B23; --ink:#E8EEE6; --muted:#9AAA9F; --line:#2A372F;
  --accent:#7BC08A; --accent-ink:#0F1712; --water:#6AA7E3; --warn:#F0A060;
  --carb:#E2B84C; --fat:#C691D8; --fib:#6CC3BB; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1712; --surface:#18231C; --soft:#1F2B23; --ink:#E8EEE6; --muted:#9AAA9F; --line:#2A372F;
  --accent:#7BC08A; --accent-ink:#0F1712; --water:#6AA7E3; --warn:#F0A060;
  --carb:#E2B84C; --fat:#C691D8; --fib:#6CC3BB; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom,0px))}
body.has-rest .app{padding-bottom:calc(176px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;line-height:1.1;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:17px;margin:0}
h3{font-size:14px;margin:0;font-weight:600}

/* ============ Header ============ */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top,0px)) 0 12px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:4px}
.datenav{display:flex;align-items:center;flex:1;min-width:0}
.icon-btn{width:40px;height:40px;flex:none;border:0;border-radius:12px;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;font:inherit}
.icon-btn:disabled{opacity:.3;cursor:default}
.date-lbl{border:0;background:transparent;color:var(--muted);font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:10px 4px;cursor:pointer}
.pill{height:34px;border:1.5px solid var(--accent);border-radius:999px;background:transparent;color:var(--accent);font:600 13px var(--body);padding:0 12px;cursor:pointer}
.meter{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:40px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.bar.water>i{background:var(--water)} .bar.over>i{background:var(--warn)}
.bar.carb>i{background:var(--carb)} .bar.fat>i{background:var(--fat)} .bar.fib>i{background:var(--fib)}
.num{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;white-space:nowrap}

/* ============ Layout pieces ============ */
main section{display:flex;flex-direction:column;gap:12px;padding-block:16px}
.card{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.soft{background:var(--soft)}
.card.link{border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.big{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:14px}
.small{font-size:12px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--ball);color:#15231B;white-space:nowrap}
.chip.ghost{background:var(--soft);color:var(--ink)}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.empty{color:var(--muted);font-size:14px;padding:4px 0}

/* buttons & inputs */
.btn{height:46px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:600 15px var(--body);padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.sm{height:38px;padding:0 12px;font-size:14px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.linkbtn{border:0;background:none;color:var(--accent);font:600 14px var(--body);padding:8px 0;cursor:pointer;text-align:left}
.x{width:36px;height:36px;flex:none;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:20px;line-height:1}
label{font-size:13px;font-weight:600;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:4px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;min-height:46px;padding:0 10px;min-width:0;width:100%}
textarea{padding:10px;min-height:70px;resize:vertical;line-height:1.4}
input:user-invalid{border-color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .full{grid-column:1/-1}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.seg button{height:38px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:600 13px var(--body);cursor:pointer;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--water);outline-offset:2px}

/* check rows */
.check{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 14px;border:0;border-radius:14px;background:var(--surface);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.check .dot{width:24px;height:24px;flex:none;border-radius:12px;border:2px solid var(--muted);display:grid;place-items:center;color:var(--accent-ink)}
.check[aria-pressed="true"] .dot{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"] .t{text-decoration:line-through;color:var(--muted)}
.check .tm{font-size:12px;font-weight:600;color:var(--muted)}
.check .t{display:block}

/* today hero */
.hero-row{display:flex;align-items:center;gap:14px}
.ring{flex:none}
.ring text{font-family:var(--display);fill:var(--ink)}
.hero-stats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.hero-stats b{display:block;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.macros{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.macros .meter .lbl{width:58px;flex:none}

/* water */
.water-top{display:flex;align-items:center;gap:12px}
.wbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 46px;gap:6px}
.wbtn{height:46px;border-radius:12px;border:2px solid var(--water);background:transparent;color:var(--water);font:600 14px var(--body);cursor:pointer}
.wbtn.solid{background:var(--water);color:var(--surface)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;min-height:44px}
.li:first-child{border-top:0}
.li .n{flex:1;min-width:0}
.li .n small{display:block;color:var(--muted);font-size:12px}
.li .k{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;font-size:13px;text-align:right}
button.li{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;text-align:left;cursor:pointer;padding-inline:0}
.group-h{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:12px 0 2px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px 7px 0;border-top:1px solid var(--line);vertical-align:top;text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:first-child td{border-top:0}
details>summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:16px;padding:4px 0;list-style-position:inside}

/* workout */
.set-row{display:grid;grid-template-columns:26px minmax(0,1fr) 70px 64px 44px;gap:6px;align-items:center}
.set-row.head{font-size:12px;color:var(--muted);font-weight:600}
.set-row input{min-height:42px;text-align:center;padding:0 4px}
.set-row .prev{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-row.done input{background:var(--soft);border-color:transparent}
.tick{height:42px;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}
.tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days button{height:44px;border:0;border-radius:12px;background:var(--surface);color:var(--ink);font:600 13px var(--body);cursor:pointer}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* mind */
.breath{background:var(--ink);color:var(--bg);border-radius:16px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.breath .big{font-size:24px}
.breath .hl{color:var(--ball)}
.breath .btn{background:var(--ball);color:#15231B}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.moods button{height:46px;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:600 13px var(--body);cursor:pointer}
.moods button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
nav.tabs button{height:56px;border:0;border-radius:12px;background:transparent;color:var(--muted);font:600 12px var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

/* rest timer bar */
.restbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:6;padding:0 12px}
.restbar .in{max-width:496px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.restbar .t{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;min-width:58px}
.restbar .bar{background:rgba(255,255,255,.2)} .restbar .bar>i{background:var(--ball)}
.restbar button{height:36px;border:0;border-radius:9px;background:rgba(255,255,255,.14);color:inherit;font:600 13px var(--body);padding:0 10px;cursor:pointer}

/* sheet (bottom dialog) */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:520px;max-height:92dvh;border-radius:20px 20px 0 0;background:var(--surface);color:var(--ink);overflow:auto;overscroll-behavior:contain}
dialog.sheet::backdrop{background:rgba(8,16,11,.5)}
.sheet-head{position:sticky;top:0;z-index:1;background:var(--surface);display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1}
.sheet-in{padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.stepper{display:grid;grid-template-columns:52px 1fr auto 52px;gap:8px;align-items:center}
.stepper button{height:52px;border:0;border-radius:12px;background:var(--soft);color:var(--ink);font-size:24px;cursor:pointer}
.stepper input{text-align:center;font-size:20px;font-weight:600;height:52px}
.toolrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.toolrow .btn{padding:0 6px;font-size:13px}
video.scan{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#000}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:min(90vw,440px);text-align:center;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.has-rest .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion: reduce){.bar>i,.toast{transition:none}}
</style>
</head>
<body>
<noscript><p style="padding:20px">FitHitesh needs JavaScript turned on.</p></noscript>
<div class="app">
  <header>
    <div class="topbar">
      <div class="datenav">

<div class="restbar" id="restbar" hidden>
  <div class="in" role="timer" aria-live="off">

</div>

<nav class="tabs" aria-label="Sections"><div class="in" role="tablist">

  <button role="tab" data-act="tab" data-tab="food" aria-selected="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg>Food</button>
  <button role="tab" data-act="tab" data-tab="train" aria-selected="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Train</button>
  <button role="tab" data-act="tab" data-tab="progress" aria-selected="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Progress</button>
  <button role="tab" data-act="tab" data-tab="mind" aria-selected="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg>Mind</button>
</div></nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   FitHitesh v2 — single-file Progressive Web App
   Everything is stored on the phone (localStorage). No account, no server.
   Edit the CONFIG block to rename the app or change starting defaults.
   ===================================================================== */
const CONFIG = {
  appName: 'FitHitesh',
  version: '2.0.0',
  storeKey: 'fithitesh.v2',
  // Pre-filled on the first-run screen (users can change them there)
  defaults: { name:'', sex:'male', age:'', heightCm:'', weightKg:'', goalKg:'', activity:1.55, ratePct:0.75 },
  offApi: 'https://world.openfoodfacts.org/api/v2/product/' // free barcode database
};

/* ---------------- Reference data ---------------- */
const DAY = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAY3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MEALS = [{id:'b',name:'Breakfast'},{id:'l',name:'Lunch'},{id:'s',name:'Snacks'},{id:'d',name:'Dinner'}];
const ACTIVITY = [[1.2,'Sedentary: desk job, little exercise'],[1.375,'Light: exercise 1–3 days a week'],[1.55,'Moderate: exercise 3–5 days a week'],[1.725,'Very active: hard exercise 6–7 days'],[1.9,'Athlete: training twice a day']];
const RATES = [[0.25,'Gentle: 0.25% of body weight a week'],[0.5,'Steady: 0.5% a week'],[0.75,'Faster: 0.75% a week'],[1,'Aggressive: 1% a week (maximum)']];
const MOODS = ['Low','Meh','Okay','Good','Great'];

// [name, serving, kcal, protein g, carbs g, fat g, fibre g] — typical home/restaurant estimates
const FOODS = [
 ['Breads & grains',[
  ['Roti / phulka','1 medium',85,3,17,0.5,2.5],['Roti with ghee','1 medium',120,3,17,4.5,2.5],['Paratha, plain','1',200,4,26,9,3],['Aloo paratha','1',290,6,38,12,4],

/* ---------------- Calculations ---------------- */
function dayTotals(k){
  const t = {kcal:0,p:0,c:0,f:0,fib:0,n:0};
  for (const e of dayGet(k).foods){ t.kcal+=e.kcal*e.qty; t.p+=e.p*e.qty; t.c+=e.c*e.qty; t.f+=e.f*e.qty; t.fib+=(e.fib||0)*e.qty; t.n++; }
  return t;
}
function trendSeries(){
  const ws = [...D.weights].sort((a,b) => a.d < b.d ? -1 : 1); const out = []; let t = null, prev = null;
  for (const w of ws){
    if (t === null) t = w.kg; else { const gap = Math.max(1, daysBetween(prev, w.d)); t += (1 - Math.pow(0.9, gap)) * (w.kg - t); }
    prev = w.d; out.push({d:w.d, kg:w.kg, trend:t});
  }
  return out;
}
function currentWeight(){ const s = trendSeries(); return s.length ? s[s.length-1].trend : D.profile.startKg; }
function bmr(kg){
  const p = D.profile; if (!p.age || !p.heightCm) return null;
  return 10*kg + 6.25*p.heightCm - 5*p.age + (p.sex === 'female' ? -161 : 5);
}
function adaptive(){ // MacroFactor-style: expenditure = average intake − energy in weight change
  const s = trendSeries(), end = todayKey(), start = addDays(end, -27);
  const pts = s.filter(p => p.d >= start && p.d <= end); if (pts.length < 2) return null;
  const a = pts[0], b = pts[pts.length-1], span = daysBetween(a.d, b.d); if (span < 10) return null;
  let sum = 0, n = 0;
  for (let k = a.d; k <= b.d; k = addDays(k,1)){ const t = dayTotals(k); if (t.n){ sum += t.kcal; n++; } }
  if (n < Math.max(8, span*0.6)) return null;
  const slope = (b.trend - a.trend) / span;
  return {tdee: sum/n - slope*7700, avg: sum/n, slope, n, span};
}
function loggedDaysRecent(){ let n = 0; for (let i=0;i<28;i++) if (dayGet(addDays(todayKey(),-i)).foods.length) n++; return n; }
function targets(){
  const p = D.profile, s = D.settings, w = currentWeight(), b = bmr(w);
  const formula = b ? b * p.activity : w * 31; // rough fallback if age/height missing
  const A = adaptive();
  let tdee = A ? A.tdee : formula;
  if (b) tdee = clamp(tdee, b*1.1, b*2.6);
  const dir = p.goalKg < w - 0.3 ? -1 : p.goalKg > w + 0.3 ? 1 : 0;
  const change = dir * (p.ratePct/100) * w * 7700 / 7; // kcal/day
  const floor = Math.max(p.sex === 'female' ? 1200 : 1500, b ? Math.round(b) : 0);
  const auto = Math.round(Math.max(floor, tdee + change) / 10) * 10;
  const kcal = s.manualKcal || auto;
  const proteinAuto = Math.round(1.8 * Math.min(w, p.goalKg || w));
  const protein = s.manualProtein || proteinAuto;
  const fat = Math.round(kcal * 0.27 / 9);
  const carbs = Math.max(50, Math.round((kcal - protein*4 - fat*9) / 4));
  return {kcal, auto, protein, proteinAuto, fat, carbs, fiber:Math.round(kcal/1000*14), tdee, formula, adaptive:A, floor, dir, belowFloor: !!(s.manualKcal && s.manualKcal < floor)};
}

const stepGoalFor = k => planFor(k).steps || D.settings.stepGoal;

function dayMinutes(k){ let m = 0; for (const a of D.activities) if (a.d === k) m += a.min; for (const w of D.workouts) if (w.d === k) m += w.dur||0; return m; }

  return `<div class="meter"><span class="lbl">${label}</span><div class="bar ${cls}"><i style="width:${clamp(val/(target||1)*100,0,100)}%"></i></div><span class="num">${fmt(val)} / ${fmt(target)} ${unit}</span></div>`;
}
function ring(eaten, target){

  return `<svg class="ring" width="124" height="124" viewBox="0 0 124 124" role="img" aria-label="${fmt(Math.abs(left))} kcal ${over?'over':'left'}">
    <circle cx="62" cy="62" r="52" fill="none" stroke="var(--line)" stroke-width="11"/>
    <circle cx="62" cy="62" r="52" fill="none" stroke="${over?'var(--warn)':'var(--accent)'}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-f)).toFixed(1)}" transform="rotate(-90 62 62)"/>

    <text x="62" y="82" text-anchor="middle" font-size="12" fill="var(--muted)" style="font-family:var(--body)">kcal ${over?'over':'left'}</text></svg>`;

function plant(f){
  const p = clamp(f, 0, 1), baseY = 78, topY = baseY - (8 + p*52); let leaves = '';

    const y = baseY - 12 - i*10; if (y < topY + 4) break;

  }

  return `<svg viewBox="0 0 80 110" width="62" height="86" aria-hidden="true"><path d="M40 ${baseY} L40 ${topY}" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>${leaves}${top}<path d="M21 80 h38 l-5 26 h-28z" fill="var(--warn)" opacity=".85"/><rect x="17" y="75" width="46" height="8" rx="3" fill="var(--warn)"/></svg>`;
}

/* ----- Progress ----- */
function weightChart(){
  const all = trendSeries(); const cut = UI.range ? addDays(todayKey(), -UI.range) : '0000-00-00';
  const pts = all.filter(p => p.d >= cut);
  if (pts.length < 2) return `<div class="card"><span class="lbl">Weight trend</span><span class="empty">Log at least two weigh-ins to see your trend line.</span></div>`;
  const W = 340, H = 170, L = 34, R = 10, T = 12, B = 22, g = D.profile.goalKg;
  const vals = pts.flatMap(p => [p.kg, p.trend]); let lo = Math.min(...vals), hi = Math.max(...vals);
  if (g >= lo - 3 && g <= hi + 3){ lo = Math.min(lo, g); hi = Math.max(hi, g); }
  lo = Math.floor(lo - 0.5); hi = Math.ceil(hi + 0.5);
  const t0 = dayNum(pts[0].d), t1 = dayNum(pts[pts.length-1].d), span = Math.max(1, t1 - t0);
  const x = d => L + (dayNum(d) - t0) / span * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const ticks = [hi, (hi+lo)/2, lo];
  const grid = ticks.map(v => `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${r1(v)}</text>`).join('');
  const goal = (g >= lo && g <= hi) ? `<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--warn)" stroke-dasharray="4 4"/>` : '';
  const dots = pts.map(p => `<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="2.8" fill="var(--muted)" opacity=".55"/>`).join('');
  const path = pts.map((p,i) => `${i?'L':'M'}${x(p.d).toFixed(1)} ${y(p.trend).toFixed(1)}`).join(' ');
  const last = pts[pts.length-1];
  return `<div class="card"><div class="spread"><span class="lbl">Weight trend</span>${segCtl([[30,'30d'],[90,'90d'],[0,'All']], UI.range, 'range')}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weight chart">${grid}${goal}${dots}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(last.d)}" cy="${y(last.trend)}" r="4.5" fill="var(--accent)"/>
    <text x="${L}" y="${H-5}" font-size="10" fill="var(--muted)">${shortDate(pts[0].d)}</text><text x="${W-R}" y="${H-5}" text-anchor="end" font-size="10" fill="var(--muted)">${shortDate(last.d)}</text></svg>
    <span class="muted small">Dots = scale readings · line = smoothed trend (ignores water-weight noise) · dashed = goal</span></div>`;
}
function renderProgress(el){
  const p = D.profile, c = currentWeight(), T = targets(), A = T.adaptive, s = trendSeries();
  const changed = c - p.startKg, toGo = p.goalKg - c;
  // pace over the last ~3 weeks of trend
  let pace = null; const win = s.filter(x => x.d >= addDays(todayKey(), -21));
  if (win.length >= 2 && daysBetween(win[0].d, win[win.length-1].d) >= 7) pace = (win[win.length-1].trend - win[0].trend) / daysBetween(win[0].d, win[win.length-1].d);
  let proj = 'Weigh in 2–3 times a week for a couple of weeks to see a projection.';

function avgRange(end, offset){
  let kc=0,pr=0,kn=0,wa=0,wn=0,st=0,sn=0,sl=0,sln=0,mn=0;
  for (let i=0;i<7;i++){
    const k = addDays(end, -offset - i), d = dayGet(k), t = dayTotals(k);
    if (t.n){ kc += t.kcal; pr += t.p; kn++; }
    if (d.water){ wa += d.water; wn++; }
    if (d.steps){ st += d.steps; sn++; }
    if (d.sleep){ sl += d.sleep; sln++; }
    mn += dayMinutes(k);
  }
  return {kcal:kn?kc/kn:null, p:kn?pr/kn:null, water:wn?wa/wn:null, steps:sn?st/sn:null, sleep:sln?sl/sln:null, min:mn};
}

function breathTick(){

  const ph = Math.floor(e/4) % 4, f = (e % 4) / 4, lo = 20, hi = 120;
  const pos = [[lo, hi - f*100],[lo + f*100, lo],[hi, lo + f*100],[hi - f*100, hi]][ph];
  dot.setAttribute('cx', pos[0]); dot.setAttribute('cy', pos[1]);

/* ----- Android app (Capacitor) helpers: native plugins exist only inside the Play Store app ----- */
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const Plug = name => NATIVE && window.Capacitor.Plugins ? window.Capacitor.Plugins[name] : null;
async function nativeScan(){
  const BS = Plug('BarcodeScanner'), msg = $('#scanMsg');
  try {
    if (!(await BS.isSupported()).supported) throw new Error('unsupported');
    const {available} = await BS.isGoogleBarcodeScannerModuleAvailable();
    if (!available){
      if (msg) msg.textContent = 'Getting the scanner ready (one-time download)… try again in a minute, or type the number.';
      await BS.installGoogleBarcodeScannerModule(); return;
    }
    const {barcodes} = await BS.scan({formats:['EAN_13','EAN_8','UPC_A','UPC_E']});
    if (barcodes && barcodes.length){ navigator.vibrate?.(60); lookupBarcode(barcodes[0].rawValue); }
  } catch(e){ if (msg && !/cancel/i.test(e.message||'')) msg.textContent = 'Scanner not available. Type the barcode number instead.'; }
}

/* ----- Barcode (BarcodeDetector + Open Food Facts) ----- */
async function startScan(){
  const vid = $('#scanVid'), msg = $('#scanMsg'); if (!vid) return;
  try {
    const det = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
    UI.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    vid.srcObject = UI.stream; await vid.play(); UI.scanning = true;
    const loop = async () => {
      if (!UI.scanning || !$('#scanVid')) return;
      try { const r = await det.detect(vid); if (r.length){ const code = r[0].rawValue; stopScan(); navigator.vibrate?.(60); lookupBarcode(code); return; } } catch(e) {}
      setTimeout(loop, 250);
    };
    loop();
  } catch(e){ if (msg) msg.textContent = 'Camera not available. Type the barcode number instead.'; vid.hidden = true; }
}
function stopScan(){ UI.scanning = false; if (UI.stream){ UI.stream.getTracks().forEach(t => t.stop()); UI.stream = null; } }
async function lookupBarcode(code){
  code = String(code).replace(/\D/g, '');
  const msg = $('#scanMsg'); if (!/^\d{6,14}$/.test(code)){ if (msg) msg.textContent = 'That does not look like a barcode.'; return; }
  const mine = D.customFoods.find(c => c.barcode === code);
  if (mine){ UI.pick.food = {...mine, src:'c', cid:mine.id}; UI.pick.qty = mine.g ? (mine.defG||100)/100 : 1; amountPanel(); return; }
  if (msg) msg.textContent = `Looking up ${code}…`;
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 10000);
  try {
    const r = await fetch(`${CONFIG.offApi}${code}.json?fields=product_name,brands,nutriments,serving_quantity`, {signal:ctl.signal});
    const j = await r.json(), pr = j.product, n = pr && pr.nutriments;
    let kcal = n && (n['energy-kcal_100g'] ?? (n['energy_100g'] != null ? n['energy_100g']/4.184 : null));
    if (!pr || kcal == null) throw new Error('nf');
    const food = {id:uid(), barcode:code, name:[pr.product_name, pr.brands && pr.brands.split(',')[0]].filter(Boolean).join(' · ').slice(0,70) || 'Product '+code, serv:'100 g', g:true, defG:Math.round(+pr.serving_quantity) || 100,
      kcal:Math.round(kcal), p:r1(+n.proteins_100g||0), c:r1(+n.carbohydrates_100g||0), f:r1(+n.fat_100g||0), fib:r1(+n.fiber_100g||0)};
    D.customFoods.unshift(food); save();
    UI.pick.food = {...food, src:'c', cid:food.id}; UI.pick.qty = food.defG/100; amountPanel();
    toast('Found and saved to My foods');
  } catch(e){
    if (msg) msg.innerHTML = `${e.name === 'AbortError' ? 'No connection.' : 'Not found in Open Food Facts.'} <button class="linkbtn" data-act="custom-new" data-meal="${UI.pick.meal}" data-code="${code}">Create it from the label ›</button>`;
  } finally { clearTimeout(to); }
}

/* ---------------- Workout helpers ---------------- */
function newExercise(name, nsets=3, reps=''){
  const prev = lastSets(name), sets = [];
  for (let i=0;i<nsets;i++){ const p = prev ? (prev[i] || prev[prev.length-1]) : null; sets.push({kg:'', reps:'', done:false, pk:p ? p.kg : '', pr:p ? p.reps : reps, prev:p ? `${p.kg}×${p.reps}` : ''}); }
  return {name, sets};
}
function tickClock(){ const el = $('#woClock'); if (el && D.active) el.textContent = mmss((Date.now() - D.active.start)/1000); }
function startRest(sec){ UI.rest = {end:Date.now() + sec*1000, total:sec}; renderRest(); }
function renderRest(){
  const bar = $('#restbar');
  if (!UI.rest){ bar.hidden = true; document.body.classList.remove('has-rest'); return; }
  const left = Math.ceil((UI.rest.end - Date.now())/1000);
  if (left <= 0){ UI.rest = null; bar.hidden = true; document.body.classList.remove('has-rest'); navigator.vibrate?.([200,100,200]); toast('Rest over — next set'); return; }
  bar.hidden = false; document.body.classList.add('has-rest');
  $('#restT').textContent = mmss(left); $('#restFill').style.width = clamp(left/UI.rest.total*100,0,100) + '%';
}
setInterval(() => { tickClock(); if (UI.rest) renderRest(); }, 1000);

/* ---------------- Files ---------------- */
async function download(name, text, type){
  const FS = Plug('Filesystem'), SH = Plug('Share');
  if (FS && SH){ // Android app: a WebView can't "download", so write to app cache and open the share sheet (Drive, Gmail, Files…)
    try {
      const {uri} = await FS.writeFile({path:name, data:text, directory:'CACHE', encoding:'utf8'});
      await SH.share({title:name, files:[uri], dialogTitle:'Save or send your file'});
    } catch(e){ if (!/cancel/i.test(e.message||'')) toast('Could not export: ' + (e.message||e)); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function csv(){
  const keys = new Set([...Object.keys(D.days), ...D.weights.map(w => w.d), ...D.activities.map(a => a.d), ...D.workouts.map(w => w.d)]);
  const wmap = Object.fromEntries(D.weights.map(w => [w.d, w.kg]));
  const rows = [['date','kcal','protein_g','carbs_g','fat_g','fibre_g','water_ml','steps','weight_kg','sleep_h','mood_1to5','active_min'].join(',')];
  for (const k of [...keys].sort()){ const d = dayGet(k), t = dayTotals(k); rows.push([k, Math.round(t.kcal), r1(t.p), r1(t.c), r1(t.f), r1(t.fib), d.water||'', d.steps??'', wmap[k]??'', d.sleep??'', d.mood??'', dayMinutes(k)||''].join(',')); }
  return rows.join('\n');
}

/* ---------------- Event wiring ---------------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b){ if (b.disabled) return; const fn = ACT[b.dataset.act]; if (fn) fn(b, e); return; }
  if (e.target === sheet && !sheet.dataset.locked) closeSheet(); // tap on the dimmed backdrop
});
document.addEventListener('submit', e => { const f = e.target, fn = FORM[f.dataset.form]; if (fn){ e.preventDefault(); fn(f, new FormData(f)); } });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'foodSearch'){ UI.q = t.value; renderResults(); }
  else if (t.id === 'amtQty'){ const v = num(t.value); if (v != null && v >= 0){ UI.pick.qty = UI.pick.food.g ? v/100 : v; amountPreview(); } }
  else if (t.dataset.set){ const [ei,si] = t.dataset.set.split(':').map(Number), s = D.active?.ex[ei]?.sets[si]; if (s){ s[t.dataset.f] = t.value === '' ? '' : +t.value; save(); } }
  else if (t.dataset.journal){ const d = dayMut(UI.date); d.journal = {...(d.journal||{}), [t.dataset.journal]:t.value.slice(0,500)}; save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'stepsIn'){ const v = num(t.value), d = dayMut(UI.date); d.steps = v != null && v >= 0 ? Math.min(100000, Math.round(v)) : null; save(); render(); }
  else if (t.id === 'sleepIn'){ const v = num(t.value), d = dayMut(UI.date); d.sleep = v != null && v >= 0 && v <= 16 ? v : null; save(); }
  else if (t.id === 'habitsTa'){ const v = parseLines(t.value); if (v.length){ D.habits = v; save(); render(); } }
  else if (t.id === 'mindTa'){ const v = parseLines(t.value); if (v.length){ D.mindList = v; save(); render(); } }
  else if (t.id === 'importFile'){
    const file = t.files && t.files[0]; if (!file) return;
    file.text().then(txt => {
      const d = JSON.parse(txt);
      if (!d || typeof d !== 'object' || !d.days || !Array.isArray(d.weights)) throw new Error('bad');
      if (!confirm('Replace everything on this phone with this backup?')) return;
      const b = blankData(); D = {...b, ...d, profile:{...b.profile, ...d.profile}, settings:{...b.settings, ...d.settings}, onboarded:true};
      save(true); closeSheet(); render(); toast('Backup restored');
    }).catch(() => toast('That file is not a FitHitesh backup'));
  }
  else if (t.dataset.path){
    const type = t.dataset.type;
    if (t.tagName === 'INPUT' && t.type === 'number' && t.value !== '' && !t.checkValidity()){ toast(`Please enter a value between ${t.min} and ${t.max}`); t.value = getPath(t.dataset.path) ?? ''; return; }
    let v = t.value;
    if (type === 'num'){ v = num(v); if (v == null){ t.value = getPath(t.dataset.path) ?? ''; return; } }
    else if (type === 'numNull'){ v = num(v); }
    else v = v.trim();
    setPath(t.dataset.path, v); save();
    const al = $('#autoLine'); if (al) al.innerHTML = autoLine();
    render();
  }
});

/* ---------------- Install & offline ---------------- */
let deferredPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('#installBtn').hidden = false; });
addEventListener('appinstalled', () => { $('#installBtn').hidden = true; toast('Installed — find it on your home screen'); });
// Android back button: close an open sheet first, otherwise leave the app
Plug('App')?.addListener('backButton', () => { if (sheet.open) closeSheet(); else Plug('App').exitApp(); });
if (!NATIVE && 'serviceWorker' in navigator && location.protocol.startsWith('http')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

/* ---------------- Boot ---------------- */
const startTab = new URLSearchParams(location.search).get('tab'); // app-icon shortcuts
if (TABS.includes(startTab)) UI.tab = startTab;
render();
if (!D.onboarded) openOnboarding();
</script>
</body>
